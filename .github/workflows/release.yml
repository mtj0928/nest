# This workflow will build a Swift project
name: Release

on: 
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: "/Applications/Xcode_26.3.app/Contents/Developer"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Swift package
        run: swift build -c release --arch arm64 --arch x86_64  
        
      - name: Get Current Tag
        run: echo "TAG_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Run shell script with tag
        run: ./Scripts/release-artifactbundle.sh "${{ env.TAG_NAME }}"

      - name: Generate installer with release checksum
        run: bash ./Scripts/generate-install-script.sh "$TAG_NAME" nest-macos.artifactbundle.zip install.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            nest-macos.artifactbundle.zip
            install.sh
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
